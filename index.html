    /* Search input & Sidebar Tools styling */

    /* ========================================================
       TTS (Text-to-Speech) Audio Reader Styling
       ======================================================== */
    .tts-target {
      position: relative;
      cursor: text; /* 自然な文字選択・ドラッグを最優先 */
      transition: background-color 0.2s ease, border-color 0.2s ease;
      border-radius: 4px;
      padding: 2px 6px 2px 28px; /* 左側に再生アイコン用の余白 */
      margin-left: -28px;
    }

    .tts-target:hover {
      background: rgba(59, 110, 246, 0.05);
    }

    /* Left-side play button (完全非表示・カーソル乗下時のみ優雅に出現) */
    .tts-play-handle {
      position: absolute;
      left: 2px;
      top: 50%;
      transform: translateY(-50%) scale(0.85);
      width: 22px;
      height: 22px;
      border-radius: 50%;

      border: 1px solid var(--accent-gold);

      cursor: pointer;

      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease;
      user-select: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .tts-target:hover .tts-play-handle {
      opacity: 1;

      transform: translateY(-50%) scale(1.08);

      color: #111;

    @media (max-width: 768px) {

    /* Floating selection tooltip */

    /* Active Speaking Paragraph Highlight */

<body>
  <!-- Reader Control & Language Topbar -->
  <header class="novel-topbar notranslate">
    <a href="#/" class="novel-topbar-title">
      <span>嘘つきパレット<span class="desktop-only">と剥落の聖女</span></span>
      <span class="sub desktop-only" style="font-size: 11px; color: var(--text-secondary); font-weight: 400;">―異端修復師は神話の塗り潰しを暴く―</span>
    </a>

    <div class="novel-topbar-controls">
      <!-- TTS Audio Reader Toggle Button -->
      <button class="ctrl-btn tts-top-btn" id="tts-toggle-btn" onclick="toggleTTSPlayer()" title="音声朗読プレイヤーを開く/閉じる">
        朗読
      </button>

      <!-- Language Selector (Worldwide Translation) -->
      <select id="lang-switcher" class="lang-select" aria-label="Language" onchange="switchLanguage(this.value)">
        <option value="ja">🇯🇵 JP</option>
        <option value="en">🇺🇸 EN</option>

        <option value="ko">🇰🇷 한국어</option>

        <option value="es">🇪🇸 ES</option>
        <option value="de">🇩🇪 DE</option>
        <option value="it">🇮🇹 IT</option>
        <option value="pt">🇧🇷 PT</option>
        <option value="ru">🇷🇺 RU</option>
        <option value="id">🇮🇩 ID</option>
        <option value="vi">🇻🇳 VI</option>
      </select>

      <!-- Settings Dropdown Toggle Button -->
      <button class="ctrl-btn settings-toggle-btn" id="settings-toggle-btn" onclick="toggleSettingsDropdown()" title="表示設定（色・フォント・サイズ）">
        表示設定
      </button>
    </div>

    <!-- Dropdown Panel for Reader Settings (Theme, Font, Font Size) -->
    <div id="reader-settings-panel" class="reader-settings-panel">
      <div class="settings-row">
        <span class="settings-label">背景色</span>
        <div class="ctrl-group">
          <button class="ctrl-btn active" id="theme-dark" onclick="setTheme('dark')">濃紺</button>
          <button class="ctrl-btn" id="theme-sepia" onclick="setTheme('sepia')">羊皮紙</button>
          <button class="ctrl-btn" id="theme-light" onclick="setTheme('light')">白亜</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">書体</span>
        <div class="ctrl-group">
          <button class="ctrl-btn active" id="font-serif" onclick="setFont('serif')">明朝体</button>
          <button class="ctrl-btn" id="font-sans" onclick="setFont('sans')">ゴシック</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">文字サイズ</span>
        <div class="ctrl-group">
          <button class="ctrl-btn" onclick="changeFontSize(-1.5)">A- 縮小</button>
          <button class="ctrl-btn" onclick="changeFontSize(1.5)">A+ 拡大</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Floating Audio Player Bar -->
  <div id="tts-player" class="tts-player notranslate">
    <div class="tts-player-top">
      <div class="tts-player-info">
        <span class="tts-player-badge">朗読中</span>
        <span id="tts-status-text" class="tts-player-text">段落をクリックすると、そこから朗読を開始します</span>
      </div>
      <button class="tts-btn" style="padding: 2px 8px; font-size: 11px;" onclick="closeTTSPlayer()" title="プレイヤーを閉じる">✕</button>
    </div>
    <div class="tts-player-controls">
      <div class="tts-btn-group">
        <button class="tts-btn" onclick="ttsPrev()" title="前の段落へ">⏮ 前へ</button>
        <button class="tts-btn tts-btn-play" id="tts-play-btn" onclick="ttsTogglePlay()">▶ 再生</button>
        <button class="tts-btn" onclick="ttsStop()" title="朗読を停止">⏹ 停止</button>
        <button class="tts-btn" onclick="ttsNext()" title="次の段落へ">⏩ 次へ</button>
      </div>
      <div class="tts-btn-group">
        <select id="tts-rate-select" class="tts-select" onchange="ttsSetRate(this.value)" title="朗読速度">
          <option value="0.8">速度: 0.8x</option>
          <option value="1.0" selected>速度: 1.0x</option>
          <option value="1.2">速度: 1.2x</option>
          <option value="1.5">速度: 1.5x</option>
          <option value="1.8">速度: 1.8x</option>
        </select>
        <select id="tts-voice-select" class="tts-select" onchange="ttsSetVoice(this.value)" title="音声選択">
          <option value="">🎙 標準音声</option>
        </select>

    </div>
  </div>

  <div id="google_translate_element"></div>
  <div id="app">読み込み中... / Loading Atelier Pentimento...</div>

  <script>
    // Reader Preferences Controller
    function toggleSettingsDropdown() {
      const panel = document.getElementById('reader-settings-panel');
      const btn = document.getElementById('settings-toggle-btn');
      panel.classList.toggle('active');
      btn.classList.toggle('active', panel.classList.contains('active'));
    }

    document.addEventListener('click', (e) => {
      const panel = document.getElementById('reader-settings-panel');
      const btn = document.getElementById('settings-toggle-btn');
      if (panel && btn && panel.classList.contains('active')) {
        if (!panel.contains(e.target) && !btn.contains(e.target)) {
          panel.classList.remove('active');
          btn.classList.remove('active');
        }
      }
    });
    let currentFontSize = parseFloat(localStorage.getItem('novel-font-size')) || 17.5;
    document.documentElement.style.setProperty('--reader-font-size', currentFontSize + 'px');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('novel-theme', theme);
      ['dark', 'sepia', 'light'].forEach(t => {
        const btn = document.getElementById('theme-' + t);
        if (btn) btn.classList.toggle('active', t === theme);
      });
    }

    function setFont(type) {
      const fontVal = type === 'sans'
        ? "'Noto Sans JP', sans-serif"
        : "'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif";
      document.documentElement.style.setProperty('--reader-font', fontVal);
      localStorage.setItem('novel-font', type);
      document.getElementById('font-serif').classList.toggle('active', type === 'serif');
      document.getElementById('font-sans').classList.toggle('active', type === 'sans');
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(24, Math.max(14, currentFontSize + delta));
      document.documentElement.style.setProperty('--reader-font-size', currentFontSize + 'px');
      localStorage.setItem('novel-font-size', currentFontSize);
    }

    // Restore saved settings
    const savedTheme = localStorage.getItem('novel-theme');
    if (savedTheme) setTheme(savedTheme);
    const savedFont = localStorage.getItem('novel-font');
    if (savedFont) setFont(savedFont);

    // Docsify Configuration
    window.$docsify = {
      name: '嘘つきパレットと剥落の聖女',
      repo: 'https://github.com/Marth1113/liars-palette-and-the-peeling-saint',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      ext: '.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 物語・用語を検索...',
        noData: '該当する記述が見つかりません',
        depth: 3
      },
      pagination: {
        previousText: '◀ 前の話へ',
        nextText: '次の話へ ▶',
        crossChapter: true,
        crossChapterText: true,
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            // 各話・ページ遷移時にページ上部へ正確にジャンプ
            const hash = location.hash || '';
            const idMatch = hash.match(/\?id=([^&]+)/);
            if (idMatch) {
              const targetId = decodeURIComponent(idMatch[1]);
              const el = document.getElementById(targetId) || document.querySelector(`[id="${targetId}"]`);
              if (el) {
                setTimeout(() => {
                  el.scrollIntoView({ behavior: 'instant', block: 'start' });
                }, 20);
              } else {
                window.scrollTo(0, 0);
              }
            } else {
              window.scrollTo(0, 0);
            }

            initTTSPage();
            trackVirtualPageview();
            initChapterActionsAndQuiz();
            initSidebarScrollSpy();

            // SPA各話遷移後に現在選択中の言語で自動翻訳を再適用
            const activeLang = localStorage.getItem('novel-lang');
            if (activeLang && activeLang !== 'ja' && typeof window.doGTranslate === 'function') {
              setTimeout(() => {
                window.doGTranslate('ja|' + activeLang);
              }, 150);
            }
          });
        }
      ]
    };

    // ========================================================
    // High-Precision TTS Audio Reader Engine (Web Speech API)
    // ========================================================
    let ttsNodes = [];
    let ttsCurrentIndex = -1;
    let ttsIsPlaying = false;
    let ttsRate = 1.0;
    let ttsVoices = [];
    let ttsSelectedVoice = null;
    let ttsUtterance = null;

    // Load voices
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      ttsVoices = window.speechSynthesis.getVoices();
      const select = document.getElementById('tts-voice-select');
      if (!select) return;
      select.innerHTML = '<option value="">🎙 標準音声</option>';

      // Filter primarily Japanese and English, or all available
      ttsVoices.forEach((voice, index) => {

        updateTTSStatus("朗読したい段落をクリックしてください");

    function setTTSPlayButton(playing) {

    function ttsSetRate(rate) {
      ttsRate = parseFloat(rate) || 1.0;

        // Restart current paragraph with new speed
        ttsPlayNode(ttsCurrentIndex);
      }
    }

    function ttsSetVoice(val) {
      ttsSelectedVoice = val !== "" && ttsVoices[parseInt(val)] ? ttsVoices[parseInt(val)] : null;
      if (ttsIsPlaying && ttsCurrentIndex >= 0) {
        ttsPlayNode(ttsCurrentIndex);
      }

    // Attach play handle & selection listener to each novel paragraph/heading/quote
    function initTTSPage() {
      ttsStop();
      ttsNodes = [];
      ttsCurrentIndex = -1;

      const content = document.querySelector('.markdown-section');
      if (!content) return;

      // Remove existing tooltip if any
      let tooltip = document.getElementById('tts-selection-tooltip');
      if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.id = 'tts-selection-tooltip';
        tooltip.textContent = '▶ ここから朗読';
        document.body.appendChild(tooltip);
      }
      tooltip.style.display = 'none';

      // Tooltip click
      tooltip.onmousedown = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (selectedNodeIndex >= 0) {
          ttsPlayFrom(selectedNodeIndex);
        }
        tooltip.style.display = 'none';
      };

      let selectedNodeIndex = -1;

      const candidates = content.querySelectorAll('p, blockquote, h1, h2, h3, li');
      candidates.forEach((node) => {
        const rawText = node.innerText.trim();
        if (rawText.length < 2 || node.closest('.novel-topbar') || node.closest('.tts-player')) return;

        node.classList.add('tts-target');
        const nodeIndex = ttsNodes.length;
        ttsNodes.push(node);

        // Add dedicated play handle button
        let handle = node.querySelector('.tts-play-handle');
        if (!handle) {
          handle = document.createElement('span');
          handle.className = 'tts-play-handle';
          handle.textContent = '▶';
          handle.title = 'ここから朗読を開始';
          node.insertBefore(handle, node.firstChild);
        }

        // Handle click exclusively starts TTS
        handle.onclick = (e) => {
          e.stopPropagation();
          ttsPlayFrom(nodeIndex);
        };

        // Text selection detection
        node.onmouseup = (e) => {
          const selection = window.getSelection();
          const selectedText = selection.toString().trim();
          if (selectedText.length > 0) {
            selectedNodeIndex = nodeIndex;
            const range = selection.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            tooltip.style.left = (rect.left + window.scrollX + rect.width / 2 - 45) + 'px';
            tooltip.style.top = (rect.top + window.scrollY) + 'px';
            tooltip.style.display = 'block';
          } else {
            tooltip.style.display = 'none';
          }
        };
      });

      // Hide tooltip when clicking anywhere else
      document.addEventListener('mousedown', (e) => {
        if (e.target !== tooltip) {
          tooltip.style.display = 'none';
        }
      });
    }

    function ttsPlayFrom(index) {
      if (!('speechSynthesis' in window)) {
        alert('お使いのブラウザは音声合成（TTS）に対応していません。');
        return;
      }
      if (window.dataLayer) {
        window.dataLayer.push({
          event: 'tts_start',
          chapter: location.hash || '/README.md',
          paragraph_index: index
        });
      }
      const player = document.getElementById('tts-player');
      player.classList.add('active');
      const toggleBtn = document.getElementById('tts-toggle-btn');
      if (toggleBtn) toggleBtn.classList.add('active');

      ttsPlayNode(index);
    }

    function ttsPlayNode(index) {
      if (index < 0 || index >= ttsNodes.length) {
        ttsStop();
        updateTTSStatus("朗読が終了しました");
        return;
      }

      window.speechSynthesis.cancel();

      // Clear previous highlight
      ttsNodes.forEach(n => n.classList.remove('tts-speaking'));

      ttsCurrentIndex = index;
      const targetNode = ttsNodes[index];
      targetNode.classList.add('tts-speaking');

      // Smooth scroll to speaking paragraph
      targetNode.scrollIntoView({ behavior: 'smooth', block: 'center' });

      const text = targetNode.innerText.replace(/[\n\r]+/g, ' ').trim();
      updateTTSStatus(`[${index + 1}/${ttsNodes.length}] ${text}`);

      ttsUtterance = new SpeechSynthesisUtterance(text);
      ttsUtterance.rate = ttsRate;

      // Select voice: user chosen, or automatic Japanese/current language matching
      if (ttsSelectedVoice) {
        ttsUtterance.voice = ttsSelectedVoice;
      } else {
        const jaVoice = ttsVoices.find(v => v.lang.startsWith('ja') || v.lang.includes('JP'));
        if (jaVoice) ttsUtterance.voice = jaVoice;
      }

      ttsUtterance.onstart = () => {
        setTTSPlayButton(true);
      };

      ttsUtterance.onend = () => {
        // Automatically play next node
        if (ttsIsPlaying) {
          ttsPlayNode(ttsCurrentIndex + 1);
        }
      };

      ttsUtterance.onerror = (e) => {
        if (e.error !== 'interrupted' && e.error !== 'canceled') {
          console.warn('TTS Error:', e);
        }
      };

      // Track TTS playback event in GA4
      if (typeof gtag === 'function' && window.GA_MEASUREMENT_ID && !ttsIsPlaying) {
        gtag('event', 'tts_play', {
          chapter: location.hash || '/README.md',
          paragraph_index: index
        });
      }

      setTTSPlayButton(true);
      window.speechSynthesis.speak(ttsUtterance);
    }

    function ttsTogglePlay() {
      if (!('speechSynthesis' in window)) return;
      if (ttsIsPlaying) {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.pause();
        }
        setTTSPlayButton(false);
      } else {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          setTTSPlayButton(true);
        } else if (ttsCurrentIndex >= 0) {
          ttsPlayNode(ttsCurrentIndex);
        } else if (ttsNodes.length > 0) {
          ttsPlayNode(0);
        }
      }
    }

    function ttsStop() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      setTTSPlayButton(false);
      ttsNodes.forEach(n => n.classList.remove('tts-speaking'));
      ttsCurrentIndex = -1;
      updateTTSStatus("朗読を停止しました");
    }

    function ttsPrev() {
      if (ttsCurrentIndex > 0) {
        ttsPlayNode(ttsCurrentIndex - 1);
      }
    }

    function ttsNext() {
      if (ttsCurrentIndex < ttsNodes.length - 1) {
        ttsPlayNode(ttsCurrentIndex + 1);
      }
    }

          activeH2 = h2Elements[h2Elements.length - 1];
        } else if (!activeH2 && h2Elements.length > 0) {
          activeH2 = h2Elements[0];
        }

        if (activeH2) {
          const anchor = activeH2.querySelector('.anchor');
          const dataId = anchor ? anchor.getAttribute('data-id') : activeH2.id;
          if (dataId) {
            subLinks.forEach(a => {
              const href = decodeURIComponent(a.getAttribute('href') || '');
              const li = a.closest('li');
              if (href.includes(dataId)) {
                li.classList.add('active');
              } else {
                li.classList.remove('active');
              }
            });
          }
        }
      }

      window.removeEventListener('scroll', updateSidebarActive);
      window.addEventListener('scroll', updateSidebarActive, { passive: true });
      setTimeout(updateSidebarActive, 100);
    }

    // Worldwide Multilingual Translation Engine (GTranslate with Browser Language Detection)
    function switchLanguage(lang) {
      localStorage.setItem('novel-lang', lang);
      localStorage.setItem('gt_autoswitch', '1');

      if (window.dataLayer) {
        window.dataLayer.push({
          event: 'language_switch',
          target_lang: lang
        });
      }
      if (typeof gtag === 'function' && window.GA_MEASUREMENT_ID) {
        gtag('event', 'language_switch', { target_lang: lang });
      }

      if (typeof window.doGTranslate === 'function') {
        window.doGTranslate('ja|' + lang);
      } else {
        const interval = setInterval(() => {
          if (typeof window.doGTranslate === 'function') {
            clearInterval(interval);
            window.doGTranslate('ja|' + lang);
          }
        }, 50);
        setTimeout(() => clearInterval(interval), 4000);
      }
    }

    // Sync dropdown with active language and detected browser language
    window.addEventListener('load', () => {
      setTimeout(() => {
        let activeLang = localStorage.getItem('novel-lang');
        if (!activeLang && window.__GT && window.__GT.translator && window.__GT.translator.current_lang) {
          activeLang = window.__GT.translator.current_lang;
        }
        if (!activeLang && navigator.language) {
          const nav = navigator.language.toLowerCase();
          if (!nav.startsWith('ja')) {
            activeLang = nav.startsWith('zh') ? 'zh-CN' : (nav.slice(0, 2) || 'en');
          }
        }
        const select = document.getElementById('lang-switcher');
        if (select && activeLang && select.querySelector(`option[value="${activeLang}"]`)) {
          select.value = activeLang;
        }
      }, 500);
    });
  </script>

  <!-- GTranslate Settings & Modern Translation Engine -->
  <div class="gtranslate_wrapper" style="display:none !important;"></div>
  <script>
    window.gtranslateSettings = {
      "default_language": "ja",
      "detect_browser_language": true,
      "languages": ["ja", "en", "zh-CN", "ko", "fr", "es", "de", "it", "pt", "ru", "id", "vi"],
      "wrapper_selector": ".gtranslate_wrapper"
    };
  </script>
  <script src="https://cdn.gtranslate.net/widgets/latest/dropdown.js" defer></script>

  <!-- Docsify & Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
